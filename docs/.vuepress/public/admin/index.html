<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CSEL 后台管理</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css" />
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a0f; color:#c8c8d0; font:15px/1.7 'Consolas',monospace; min-height:100vh; }
a { color:#1e90ff; text-decoration:none; }
input,textarea,select { font:14px/1.5 'Consolas',monospace; background:#111; border:1px solid #2a2a3a; color:#fff; padding:8px 10px; }
input:focus,textarea:focus,select:focus { border-color:#00d4aa; outline:none; }
button { font:14px 'Consolas',monospace; cursor:pointer; }
.green { color:#00d4aa; }
.red { color:#e74c3c; }
.dim { opacity:.6; }

/* Layout */
.app { display:flex; height:100vh; }
.sidebar { width:220px; background:#0e0e16; border-right:1px solid #2a2a3a; padding:16px 0; flex-shrink:0; }
.sidebar .logo { padding:8px 20px 16px; font-weight:bold; color:#00d4aa; font-size:17px; border-bottom:1px solid #2a2a3a; margin-bottom:8px; }
.sidebar .nav-item { display:block; padding:8px 20px; color:#aaa; cursor:pointer; }
.sidebar .nav-item:hover, .sidebar .nav-item.active { color:#fff; background:#1a1a28; }
.main { flex:1; overflow-y:auto; padding:24px 32px; }

/* Login */
.login-wrap { max-width:400px; margin:120px auto; padding:0 20px; }
.login-wrap h1 { color:#00d4aa; margin-bottom:16px; }
.login-wrap input { width:100%; margin:8px 0; }
.login-wrap .btn { width:100%; padding:12px; background:#00d4aa; color:#000; border:none; font-weight:bold; margin:12px 0; }
.login-wrap .hint { font-size:13px; }

/* Page */
.page-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.page-bar h2 { color:#00d4aa; }
.btn { padding:8px 16px; border:1px solid #00d4aa; background:transparent; color:#00d4aa; }
.btn:hover { background:#00d4aa; color:#000; }
.btn-sm { padding:4px 10px; font-size:12px; }
.btn-red { border-color:#e74c3c; color:#e74c3c; }
.btn-red:hover { background:#e74c3c; color:#fff; }
.btn-amber { border-color:#f39c12; color:#f39c12; }
.btn-amber:hover { background:#f39c12; color:#000; }

/* Table */
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:10px 12px; border-bottom:1px solid #2a2a3a; }
th { color:#666; font-weight:normal; font-size:13px; }

/* Modal */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; z-index:100; }
.modal { background:#1a1a28; border:1px solid #2a2a3a; width:680px; max-width:90vw; max-height:85vh; overflow-y:auto; padding:24px; }
.modal h3 { color:#00d4aa; margin-bottom:16px; }
.modal label { display:block; margin:12px 0 4px; font-size:13px; opacity:.7; }
.modal input, .modal textarea { width:100%; }
.modal textarea { min-height:50vh; }
.modal .btns { display:flex; gap:10px; margin-top:16px; }

/* Rich Editor */
.editor-wrap { display:flex; flex-direction:column; gap:0; }
.editor-toolbar { display:flex; flex-wrap:wrap; gap:4px; padding:8px; background:#111; border:1px solid #2a2a3a; border-bottom:none; }
.editor-toolbar button { background:#1a1a28; border:1px solid #2a2a3a; color:#c8c8d0; padding:4px 10px; font-size:13px; cursor:pointer; }
.editor-toolbar button:hover { border-color:#00d4aa; }
.editor-panes { display:flex; gap:0; border:1px solid #2a2a3a; height:60vh; }
.editor-panes textarea, .editor-preview { width:50%; height:100%; padding:12px; font:14px/1.6 'Consolas',monospace; }
.editor-panes textarea { background:#0a0a0f; color:#c8c8d0; border:none; resize:none; overflow-y:auto; }
.editor-preview { background:#0e0e16; color:#c8c8d0; border-left:1px solid #2a2a3a; overflow-y:auto; }
.editor-preview h1, .editor-preview h2 { color:#00d4aa; }
.editor-preview a { color:#1e90ff; }
.editor-preview code { background:#1a1a28; padding:2px 6px; border-radius:3px; }
.editor-preview pre { background:#1a1a28; padding:12px; overflow-x:auto; }
.editor-preview img { max-width:100%; }
.editor-preview blockquote { border-left:3px solid #00d4aa; padding-left:12px; opacity:.8; }
.katex { font-size:1.1em; }

/* Warning */
.warn { background:#1a1a28; border:1px solid #f39c12; padding:12px 16px; margin:12px 0; font-size:13px; }
.warn b { color:#f39c12; }

/* ── Light Theme ── */
body.theme-light { background:#f5f5f0; color:#2c2c2c; }
.theme-light input, .theme-light textarea, .theme-light select { background:#fff; border-color:#ccc; color:#333; }
.theme-light button { color:#333; }
.theme-light .sidebar { background:#eee; border-right-color:#ccc; }
.theme-light .sidebar .logo { color:#1a7a5a; }
.theme-light .sidebar .nav-item { color:#555; }
.theme-light .sidebar .nav-item:hover, .theme-light .sidebar .nav-item.active { background:#ddd; color:#000; }
.theme-light .main { background:#f5f5f0; }
.theme-light table th, .theme-light table td { border-bottom-color:#ddd; }
.theme-light .modal { background:#fff; border-color:#ccc; }
.theme-light .editor-toolbar { background:#eee; border-color:#ccc; }
.theme-light .editor-toolbar button { background:#fff; border-color:#ccc; color:#333; }
.theme-light .editor-panes textarea { background:#fff; color:#333; }
.theme-light .editor-preview { background:#fafaf5; color:#333; border-left-color:#ccc; }
.theme-light .editor-preview code { background:#eee; }
.theme-light .editor-preview pre { background:#eee; }
.theme-light .warn { background:#fff8e1; border-color:#f39c12; }
.theme-light .warn b { color:#e67e22; }
.theme-light .green { color:#1a7a5a; }
.theme-light .dim { opacity:.6; }
.theme-light .btn { border-color:#1a7a5a; color:#1a7a5a; }
.theme-light .btn:hover { background:#1a7a5a; color:#fff; }
.theme-light .btn-red { border-color:#c0392b; color:#c0392b; }
.theme-light .btn-red:hover { background:#c0392b; color:#fff; }
.theme-light .btn-amber { border-color:#e67e22; color:#e67e22; }
.theme-light .btn-amber:hover { background:#e67e22; color:#fff; }
.theme-light [class^="btn"]:disabled { opacity:.4; cursor:default; }
.theme-light .page-bar h2 { color:#1a7a5a; }
.theme-light .hamburger { color:#1a7a5a; border-color:#ccc; }

/* ── Mobile Responsive ── */
.hamburger { display:none; position:fixed; top:12px; left:12px; z-index:200; background:none; border:1px solid #2a2a3a; color:#00d4aa; font-size:22px; padding:4px 12px; cursor:pointer; }
.sidebar-overlay { display:none; }
@media (max-width:768px) {
  body { font-size:14px; }
  .hamburger { display:block; }
  .app { display:block; position:relative; padding-top:50px; }
  .sidebar { position:fixed; left:-240px; top:0; bottom:0; width:240px; z-index:150; transition:left .25s; }
  .sidebar.open { left:0; }
  .sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:140; }
  .sidebar-overlay.show { display:block; }
  .main { padding:16px; }
  .page-bar { flex-direction:column; align-items:stretch; gap:8px; }
  .page-bar h2 { font-size:18px; }
  table { display:block; overflow-x:auto; }
  th, td { padding:8px; font-size:13px; white-space:nowrap; }
  .btn { padding:10px 16px; min-height:44px; }
  .btn-sm { padding:8px 12px; min-height:36px; }
  input, textarea { font-size:16px !important; } /* 防 iOS 缩放 */
  .modal { width:95vw; max-width:none; margin:10px; padding:16px; }
  .modal textarea { min-height:auto; }
  .editor-panes { display:block; height:auto; }
  .editor-panes textarea, .editor-preview { width:100%; height:40vh; display:block; }
  .editor-preview { border-left:none; border-top:1px solid #2a2a3a; }
  .theme-light .editor-preview { border-top-color:#ccc; }
  .login-wrap { margin:80px auto; }
  .login-wrap input { font-size:16px; min-height:44px; }
  .login-wrap .btn { min-height:48px; }
}
</style>
</head>
<body>

<div id="app"></div>

<script>
const REPO = 'MEMZ-CHROER/vuepress-website';
const BRANCH = 'master';
const SITE = '.';
// ⚠️ Cloudflare Worker 后端地址（admin API 由 blog-api.liuxiyu.cn 提供）
const API_BASE = 'https://blog-api.liuxiyu.cn';
var shaMap = {};

// ── VuePress 迁移：路径工具 ──
// 仓库真实路径 → 站点 URL（docs/hacknet/foo.md → /hacknet/foo）
function repoPathToUrl(p) {
  // 目录式：docs/hacknet/commands/README.md → /hacknet/commands
  var url = '/' + p.replace(/^docs\//, '').replace(/\.md$/, '').replace(/\/README$/, '');
  if (url === '/') return '/';
  return url;
}
// 确保路径带 docs/ 前缀（新建/复制/上传）
function ensureDocsPath(p) {
  if (!p) return p;
  return p.indexOf('docs/') === 0 ? p : 'docs/' + p;
}

// ── 密码 ──
var _session = null;

// ── GitHub API ──
function gh(url, opts) {
  opts = opts || {};
  // Auto-inject session token into write operations for backend permission check
  if (opts.body && _session && _session.token) {
    try {
      var bodyObj = JSON.parse(opts.body);
      bodyObj._token = _session.token;
      opts.body = JSON.stringify(bodyObj);
    } catch(e) {}
  }
  return fetch(API_BASE + '/api' + url, Object.assign({
    headers: { Accept: 'application/vnd.github.v3+json' }
  }, opts)).then(function(r) {
    if (r.status === 204) return {};   // 无内容响应（如 Actions dispatch）
    return r.json().catch(function() {
      return r.text().then(function(t) { throw new Error('HTTP ' + r.status + ': ' + t.substring(0,80)); });
    });
  });
}

function ghRaw(url) {
  return fetch(API_BASE + '/raw' + url, {
    headers: { Accept: 'application/vnd.github.v3.raw' }
  }).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + url);
    return r.text().then(function(t) {
      // Check if API returned JSON instead of raw content
      if (t.charAt(0) === '{' || t.charAt(0) === '[') {
        try { var j = JSON.parse(t); if (j.name || j.message) throw new Error('API returned JSON: ' + (j.message || j.name)); } catch(e) { if (e.message.indexOf('API')>-1) throw e; }
      }
      return t;
    });
  });
}

function b64enc(s) { return btoa(unescape(encodeURIComponent(s))); }
function b64dec(s) { return decodeURIComponent(escape(atob(s))); }

// ── Page States ──
var state = 'dashboard';

function toggleSidebar() {
  var s = document.querySelector('.sidebar');
  var o = document.querySelector('.sidebar-overlay');
  if (s) s.classList.toggle('open');
  if (o) o.classList.toggle('show');
}

function render() {
  if (!_session) return renderLogin();
  var html = '';
  html += '<button class="hamburger" onclick="toggleSidebar()">☰</button>';
  html += '<div class="sidebar-overlay" onclick="toggleSidebar()"></div>';
  html += '<div class="app">';
  html += '<div class="sidebar">';
  html += '<div class="logo">[CSEL] Admin</div>';
  html += '<a class="nav-item'+(state==='dashboard'?' active':'')+'" onclick="go(\'dashboard\')">🏠 仪表盘</a>';
  if (hasPerm('pages')) html += '<a class="nav-item'+(state==='pages'?' active':'')+'" onclick="go(\'pages\')">📄 页面管理</a>';
  if (hasPerm('media')) html += '<a class="nav-item'+(state==='media'?' active':'')+'" onclick="go(\'media\')">🖼 媒体库</a>';
  if (hasPerm('navbar')) html += '<a class="nav-item'+(state==='navbar'?' active':'')+'" onclick="go(\'navbar\')">🔗 导航栏</a>';
  if (hasPerm('sidebar')) html += '<a class="nav-item'+(state==='sidebar'?' active':'')+'" onclick="go(\'sidebar\')">📑 侧边栏</a>';
  if (hasPerm('pages')) html += '<a class="nav-item'+(state==='new'?' active':'')+'" onclick="go(\'new\')">➕ 新建页面</a>';
  if (hasPerm('passwords')) html += '<a class="nav-item'+(state==='passwords'?' active':'')+'" onclick="go(\'passwords\')">🔐 页面密码</a>';
  if (isAdmin()) html += '<a class="nav-item'+(state==='users'?' active':'')+'" onclick="go(\'users\')">👥 用户管理</a>';
  // 站点设置/样式编辑器暂隐藏：本博客用 config.js + theme-hope，不支持 JSON 图形化编辑
  // if (isAdmin()) html += '<a class="nav-item'+(state==='settings'?' active':'')+'" onclick="go(\'settings\')">⚙ 站点设置</a>';
  // if (isAdmin()) html += '<a class="nav-item'+(state==='style'?' active':'')+'" onclick="go(\'style\')">🎨 样式编辑器</a>';
  if (isAdmin()) html += '<a class="nav-item'+(state==='pagesbuild'?' active':'')+'" onclick="go(\'pagesbuild\')">🚀 Pages 构建</a>';
  html += '<a class="nav-item'+(state==='search'?' active':'')+'" onclick="go(\'search\')">🔍 搜索</a>';
  if (isAdmin()) html += '<a class="nav-item'+(state==='sitemap'?' active':'')+'" onclick="go(\'sitemap\')">🗺 站点地图</a>';
  html += '<div style="padding:8px 12px;font-size:12px;opacity:.6">' + _session.username + ' (' + _session.role + ')</div>';
  var currentTheme = localStorage.getItem('csel_theme') || 'dark';
  html += '<a class="nav-item" onclick="toggleTheme()" style="color:#666">' + (currentTheme === 'dark' ? '☀️ 亮色主题' : '🌙 暗色主题') + '</a>';
  html += '<a class="nav-item" onclick="logout()" style="color:#666">🚪 退出</a>';
  html += '</div>';
  html += '<div class="main" id="main"></div>';
  html += '</div>';
  document.getElementById('app').innerHTML = html;
  loadPage();
}

function go(s) {
  // 导航栏/站点设置/样式编辑器暂不可用（本博客用 config.js + theme-hope，无 JSON 配置）
  if (s === 'settings' || s === 'style') { alert('此功能暂不可用（博客使用 config.js 配置，不支持图形化编辑）'); return; }
  state=s; render();
}

function logout() {
  fetch(API_BASE + '/api/auth/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: _session.token }) });
  _session = null; localStorage.removeItem('csel_session'); render();
}

// ── Render Login ──
function hasPerm(p) {
  return _session && (_session.permissions === 'all' || (_session.permissions && _session.permissions.indexOf(p) > -1));
}

function isAdmin() { return _session && _session.role === 'admin'; }

window.login = function() {
  var user = document.getElementById('loginUser').value.trim();
  var pass = document.getElementById('loginPass').value;
  if (!user || !pass) return;
  fetch(API_BASE + '/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: user, password: pass })
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.token) {
      _session = d;
      localStorage.setItem('csel_session', JSON.stringify(d));
      render();
    } else {
      document.getElementById('app').innerHTML = '<div class="login-wrap"><h1>[CSEL] 后台管理</h1><p class="red">❌ ' + (d.error || '登录失败') + '</p><input type="text" id="loginUser" placeholder="用户名" /><input type="password" id="loginPass" placeholder="密码" /><button class="btn" onclick="login()">登录</button></div>';
    }
  }).catch(function() {
    document.getElementById('app').innerHTML = '<div class="login-wrap"><h1>[CSEL] 后台管理</h1><p class="red">❌ 网络错误</p><input type="text" id="loginUser" placeholder="用户名" /><input type="password" id="loginPass" placeholder="密码" /><button class="btn" onclick="login()">登录</button></div>';
  });
};

function renderLogin() {
  document.getElementById('app').innerHTML = '<div class="login-wrap"><h1>[CSEL] 后台管理</h1><p class="dim">登录</p><input type="text" id="loginUser" placeholder="用户名" /><input type="password" id="loginPass" placeholder="密码" /><button class="btn" onclick="login()">登录</button></div>';
}

// ── Page List ──
function loadPage() {
  if (state === 'dashboard') loadDashboard();
  else if (state === 'pages') loadList();
  else if (state === 'media') loadMedia();
  else if (state === 'navbar') loadNavbar();
  else if (state === 'new') { if (!hasPerm('pages')) { go('dashboard'); return; } loadNew(); }
  else if (state === 'settings') loadSettings();
  else if (state === 'style') loadStyle();
  else if (state === 'passwords') { if (!hasPerm('passwords')) { go('dashboard'); return; } loadPasswords(); }
  else if (state === 'pagesbuild') { if (!isAdmin()) { go('dashboard'); return; } loadPagesBuild(); }
  else if (state === 'sitemap') { if (!isAdmin()) { go('dashboard'); return; } loadSitemap(); }
  else if (state === 'users') { if (!isAdmin()) { go('dashboard'); return; } loadUsers(); }
  else if (state === 'search') loadSearch();
  else if (state === 'sidebar') { if (!hasPerm('sidebar')) { go('dashboard'); return; } loadSidebar(); }
}

// ── Dashboard ──
function loadDashboard() {
  var main = document.getElementById('main');
  main.innerHTML = '<p>加载中...</p>';
  Promise.all([
    gh('/repos/' + REPO + '/git/trees/' + BRANCH + '?recursive=1'),
    gh('/repos/' + REPO + '/commits?per_page=10').catch(function() { return []; })
  ]).then(function(results) {
    var data = results[0];
    var commits = results[1] || [];
    if (data.message) { main.innerHTML = '<p class="red">' + data.message + '</p>'; return; }
    var mds = data.tree.filter(function(f) { return f.path.endsWith('.md') && f.path !== 'README.md'; });
    var imgs = data.tree.filter(function(f) { return f.path.startsWith('.vuepress/public/assets/img/'); });
    var recent = data.tree.slice(-10).reverse();
    var html = '<div class="page-bar"><h2>🏠 仪表盘</h2></div>';
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:24px;">';
    html += '<div style="background:#111;border:1px solid #2a2a3a;padding:20px;text-align:center"><div style="font-size:32px;color:#00d4aa;font-weight:bold">' + mds.length + '</div><div class="dim">页面</div></div>';
    html += '<div style="background:#111;border:1px solid #2a2a3a;padding:20px;text-align:center"><div style="font-size:32px;color:#00d4aa;font-weight:bold">' + imgs.length + '</div><div class="dim">图片</div></div>';
    html += '<div style="background:#111;border:1px solid #2a2a3a;padding:20px;text-align:center"><div style="font-size:32px;color:#00d4aa;font-weight:bold">' + data.tree.length + '</div><div class="dim">文件</div></div>';
    html += '<div style="background:#111;border:1px solid #2a2a3a;padding:20px;text-align:center"><div style="font-size:32px;color:#00d4aa;font-weight:bold">' + (Array.isArray(commits) ? commits.length : 0) + '</div><div class="dim">最近提交</div></div>';
    html += '</div>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px;">';
    if (hasPerm('pages')) html += '<button class="btn" onclick="go(\'new\')">➕ 新建页面</button>';
    if (hasPerm('media')) html += '<button class="btn" onclick="go(\'media\')">🖼 上传图片</button>';
    // if (hasPerm('navbar')) html += '<button class="btn" onclick="go(\'navbar\')">🔗 编辑导航</button>';
    html += '<button class="btn" onclick="go(\'sitemap\')">🗺 站点地图</button>';
    html += '</div>';

    // Recent commits
    if (Array.isArray(commits) && commits.length > 0) {
      html += '<b>最近提交</b><table><tr><th>时间</th><th>作者</th><th>描述</th></tr>';
      commits.forEach(function(c) {
        var date = c.commit ? c.commit.author.date.substring(0, 10) : '?';
        var author = c.commit ? c.commit.author.name : '?';
        var msg = c.commit ? c.commit.message.split('\n')[0] : '?';
        html += '<tr><td style="white-space:nowrap">' + date + '</td><td>' + escHtml(author) + '</td><td class="dim">' + escHtml(msg) + '</td></tr>';
      });
      html += '</table>';
    }

    html += '<b>最近文件变更</b><table><tr><th>文件</th><th>大小</th></tr>';
    recent.slice(0,10).forEach(function(f) {
      html += '<tr><td>' + escHtml(f.path) + '</td><td>' + (f.size ? (f.size/1024).toFixed(1) + 'KB' : '-') + '</td></tr>';
    });
    html += '</table>';
    main.innerHTML = html;
  }).catch(function(e) {
    main.innerHTML = '<p class="red">加载失败: ' + (e.message||e) + '</p>';
  });
}

// ── Media Library ──
function loadMedia() {
  if (!hasPerm('media')) { go('dashboard'); return; }
  var main = document.getElementById('main');
  main.innerHTML = '<p>加载中...</p><div style="margin-top:12px"><input type="file" id="mediaUpload" accept="image/*" onchange="uploadMedia()" /></div>';
  gh('/repos/' + REPO + '/git/trees/' + BRANCH + '?recursive=1').then(function(data) {
    if (data.message) { main.innerHTML = '<p class="red">' + data.message + '</p>'; return; }
    var imgs = data.tree.filter(function(f) { return f.path.startsWith('.vuepress/public/assets/img/'); });
    var html = '<div class="page-bar"><h2>🖼 媒体库</h2></div>';
    html += '<div style="margin-bottom:12px"><input type="file" id="mediaUpload" accept="image/*" onchange="uploadMedia()" /> <span id="mediaStatus" class="dim"></span></div>';
    if (imgs.length === 0) { html += '<p class="dim">暂无图片</p>'; main.innerHTML = html; return; }
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;">';
    imgs.forEach(function(f) {
      var url = 'https://raw.githubusercontent.com/MEMZ-CHROER/vuepress-website/master/' + f.path;
      var name = f.path.split('/').pop();
      html += '<div style="background:#111;border:1px solid #2a2a3a;overflow:hidden;">';

function loadPasswords() {
  var main = document.getElementById('main');
  main.innerHTML = '<p>加载中...</p>';

    gh('/repos/' + REPO + '/git/trees/' + BRANCH + '?recursive=1'),

      window._pwSha = meta.sha;
      var raw = meta.content.replace(/\n/g, '');
      var txt = atob(raw);
      try { txt = decodeURIComponent(escape(txt)); } catch(e) {}
      return JSON.parse(txt);
    }).catch(function() { return {}; })
  ]).then(function(results) {
    var tree = results[0];
    if (tree.message) { main.innerHTML = '<p class="red">' + tree.message + '</p>'; return; }
    var pwData = results[1] || {};
    var pages = tree.tree.filter(function(f) { return f.path.startsWith('docs/') && f.path.endsWith('.md') && f.path !== 'docs/README.md'; });
    var html = '<div class="page-bar"><h2>🔐 页面密码</h2></div>';

    html += '<table><tr><th>页面</th><th>密码</th><th>操作</th></tr>';
    pages.forEach(function(f) {
      var pagePath = repoPathToUrl(f.path);

      var hasPw = pwData[pagePath] ? pwData[pagePath] : '';
      html += '<tr><td>' + pagePath + '</td>';
      html += '<td><input type="text" data-page-path="' + escHtml(pagePath) + '" value="' + escHtml(hasPw) + '" placeholder="留空 = 不加密" style="width:160px;font-size:13px;" /></td>';
      html += '<td><button class="btn btn-sm" onclick="savePw(this)">保存</button></td></tr>';
    });
    html += '</table>';
    html += '<div style="margin-top:12px"><button class="btn" onclick="saveAllPw()">💾 保存全部密码</button> <span id="pwStatus" class="dim"></span></div>';

  }).catch(function(e) {
    main.innerHTML = '<p class="red">加载失败: ' + (e.message||e) + '</p>';

window.savePw = function(btn) {
  var row = btn.closest('tr');
  var inp = row ? row.querySelector('input[data-page-path]') : null;
  if (!inp) return;
  var pagePath = inp.getAttribute('data-page-path');
  var val = inp.value.trim();
  document.getElementById('pwStatus').textContent = '保存中...';
  gh('/repos/' + REPO + '/contents/_passwords.json?ref=' + BRANCH).then(function(meta) {
    var raw = meta.content.replace(/\n/g, '');
    var txt = atob(raw);
    try { txt = decodeURIComponent(escape(txt)); } catch(e) {}
    var pwData = JSON.parse(txt);
    if (val) pwData[pagePath] = val;
    else delete pwData[pagePath];
    var newContent = JSON.stringify(pwData, null, 2);
    gh('/repos/' + REPO + '/contents/_passwords.json', { method: 'PUT', body: JSON.stringify({
      message: 'update password for ' + pagePath,
      content: b64enc(newContent),
      sha: meta.sha,
      branch: BRANCH
    })}).then(function(d) {
      if (d.content) { document.getElementById('pwStatus').textContent = '✅ 已保存（Pages 重建后生效）'; }
      else document.getElementById('pwStatus').textContent = '❌ 保存失败';
    });
  });
};

window.saveAllPw = function() {
  document.getElementById('pwStatus').textContent = '保存中...';
  gh('/repos/' + REPO + '/contents/_passwords.json?ref=' + BRANCH).then(function(meta) {
    // Read all password inputs using data attributes
    var inputs = document.querySelectorAll('input[data-page-path]');
    var newData = {};

      var pagePath = inp.getAttribute('data-page-path');
      if (inp.value.trim()) newData[pagePath] = inp.value.trim();
    });
    var newContent = JSON.stringify(newData, null, 2);
    gh('/repos/' + REPO + '/contents/_passwords.json', { method: 'PUT', body: JSON.stringify({
      message: 'update all passwords',
      content: b64enc(newContent),
      sha: meta.sha,
      branch: BRANCH
    })}).then(function(d) {
      if (d.content) { document.getElementById('pwStatus').textContent = '✅ 已保存，触发 Pages 重建...'; }
      else document.getElementById('pwStatus').textContent = '❌ 保存失败';
    });
  });
};

function loadSearch() {

    '<input type="text" id="searchQuery" placeholder="输入关键词搜索所有页面…" onkeyup="if(event.key==\'Enter\')doSearch()" style="width:100%;padding:10px;font-size:15px;" />' +
    '<div style="margin-top:8px"><button class="btn" onclick="doSearch()">搜索</button></div>' +
    '<div id="searchResults" style="margin-top:16px"></div>';
  document.getElementById('searchQuery').focus();

window.doSearch = function() {
  var q = document.getElementById('searchQuery').value.trim().toLowerCase();
  var results = document.getElementById('searchResults');
  if (!q) { results.innerHTML = ''; return; }
  results.innerHTML = '<p>搜索中...</p>';
  gh('/repos/' + REPO + '/git/trees/' + BRANCH + '?recursive=1').then(function(data) {
    if (data && data.message) { results.innerHTML = '<p class="red">' + data.message + '</p>'; return; }
    var mds = (data && data.tree || []).filter(function(f) { return f.path.startsWith('docs/') && f.path.endsWith('.md') && f.path !== 'docs/README.md'; });
    if (mds.length === 0) { results.innerHTML = '<p class="dim">没有页面</p>'; return; }
    var found = [];
    var idx = 0;
    // 串行处理，避免并发请求挂起；任何情况最终都会渲染结果
    function next() {
      if (idx >= mds.length) { renderSearchResults(q, found, results); return; }
      var f = mds[idx++];
      var finished = false;
      var timer = setTimeout(function() { if (!finished) { finished = true; next(); } }, 15000); // 15s 超时兜底
      ghRaw('/repos/' + REPO + '/contents/' + f.path + '?ref=' + BRANCH).then(function(content) {
        if (finished) return;
        finished = true; clearTimeout(timer);
        var text = String(content || '').toLowerCase();
        if (text.indexOf(q) > -1) {
          var ei = text.indexOf(q);
          var start = Math.max(0, ei - 40);
          var end = Math.min(text.length, ei + q.length + 40);
          var excerpt = String(content).substring(start, end).replace(/\n/g, ' ').trim();
          if (start > 0) excerpt = '...' + excerpt;
          if (end < content.length) excerpt += '...';
          found.push({ path: f.path, excerpt: excerpt });
        }
        next();
      }).catch(function() {
        if (finished) return;
        finished = true; clearTimeout(timer);
        next(); // 失败继续下一个，不阻塞
      });
    }
    next();
  }).catch(function(e) {
    results.innerHTML = '<p class="red">加载失败: ' + (e.message || e) + '</p>';
  });
};

function renderSearchResults(q, found, results) {
  if (found.length === 0) {
    results.innerHTML = '<p class="dim">未找到包含 "' + q + '" 的页面</p>';
    return;
  }
  var html = '<p>找到 ' + found.length + ' 个结果：</p><table>';
  found.forEach(function(f) {
    var pagePath = repoPathToUrl(f.path);
    html += '<tr><td><a href="' + SITE + pagePath + '" target="_blank">' + f.path + '</a><br><span class="dim" style="font-size:12px;">' + escHtml(f.excerpt) + '</span></td>';
    html += '<td style="width:80px"><button class="btn btn-sm" onclick="editFile(\'' + f.path + '\')">编辑</button></td></tr>';
  });
  html += '</table>';
  results.innerHTML = html;
}

function editFile(path) {
  ghRaw('/repos/' + REPO + '/contents/' + path + '?ref=' + BRANCH).then(function(content) {
    showModal(path, content);
  });
}

function parseFrontmatter(raw) {
  var m = raw.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  if (!m) return { meta: {}, body: raw };
  var meta = {};
  m[1].split('\n').forEach(function(line) {
    var kv = line.match(/^\s*(\w+)\s*:\s*(.+)$/);
    if (kv) meta[kv[1]] = kv[2].trim().replace(/^["']|["']$/g, '');
  });
  return { meta: meta, body: (m[2]||'').trimStart() };
}

function buildFrontmatter(meta, body) {
  var fm = '---\n';
  if (meta.title) fm += 'title: ' + meta.title + '\n';
  fm += '---\n\n' + body.trimStart();
  return fm;
}

// ── Draft Auto-Save ──
const DRAFT_PREFIX = 'csel_draft_';

function draftKey(path) { return DRAFT_PREFIX + path; }

function saveDraft(path, content) {
  try { localStorage.setItem(draftKey(path), content); } catch(e) {}
}

function loadDraft(path) {
  try { return localStorage.getItem(draftKey(path)); } catch(e) { return null; }
}

function clearDraft(path) {
  try { localStorage.removeItem(draftKey(path)); } catch(e) {}
}

function hasDraft(path) {
  return loadDraft(path) !== null;
}

function wordCount(text) {
  var words = text.trim() ? text.trim().split(/\s+/).length : 0;
  var lines = text ? text.split('\n').length : 0;
  var paras = text ? text.split(/\n\s*\n/).filter(function(p) { return p.trim(); }).length : 0;
  return { words: words, lines: lines, paras: paras };
}

function updateEditorStats(prefix) {
  var el = document.getElementById(prefix + '_stats');
  if (!el) return;
  var ta = document.getElementById(prefix === 'modal' ? 'mcontent' : 'ncontent');
  if (!ta) { el.textContent = ''; return; }
  var wc = wordCount(ta.value);
  el.textContent = wc.lines + ' 行 · ' + wc.words + ' 字 · ' + wc.paras + ' 段';
}

function showModal(path, content) {
  var parsed = parseFrontmatter(content || '');
  var meta = parsed.meta;
  var body = parsed.body;
  var isNew = !content || content.trim() === '';
  // Check for draft
  var draft = loadDraft(path);
  var draftNotice = '';
  if (draft !== null) {
    var draftParsed = parseFrontmatter(draft);
    if (draftParsed.body !== body && !isNew) {
      draftNotice = '<div class="warn" style="margin-bottom:8px"><b>💾 草稿已恢复</b> 上次未保存的编辑已自动加载。 <button class="btn btn-sm" onclick="discardDraft(\'' + path + '\')">丢弃草稿</button></div>';
      body = draftParsed.body;
      if (draftParsed.meta.title) meta.title = draftParsed.meta.title;
    }
  }
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  var h = [];
  h.push('<div class="modal" style="width:90vw;max-width:960px;">');
  h.push('<h3>编辑: ' + escHtml(path) + '</h3>');
  h.push('<label style="margin-bottom:4px">文件名</label><input type="text" id="mpath" value="' + escHtml(path) + '" style="width:100%;margin-bottom:8px;" />');
  h.push(draftNotice);
  h.push('<div style="display:flex;gap:12px;margin-bottom:8px;">');
  h.push('<div style="flex:1"><label style="display:block;font-size:13px;opacity:.7;margin-bottom:2px">标题（YAML title）</label><input type="text" id="mtitle" value="' + escHtml(meta.title||'') + '" style="width:100%;font-size:13px;" oninput="updatePreviewFromMeta()" /></div>');
  h.push('</div>');
  h.push('<div class="editor-wrap"><div class="editor-toolbar" id="modalToolbar"></div><div class="editor-panes">');
  h.push('<textarea id="mcontent" oninput="onModalEdit(\'' + path + '\')">' + escHtml(body||'') + '</textarea>');
  h.push('<div class="editor-preview" id="mdPreview"></div>');
  h.push('</div></div>');
  h.push('<div id="modal_stats" class="dim" style="text-align:right;font-size:12px;padding:4px 0;"></div>');
  h.push('<div class="btns" style="margin-top:4px">');
  h.push('<button class="btn" onclick="saveModal()">💾 保存</button>');
  h.push('<button class="btn" onclick="viewHistory(\'' + path + '\')">📜 历史</button>');
  h.push('<button class="btn btn-red" onclick="closeModal()">取消</button></div>');
  h.push('</div>');
  overlay.innerHTML = h.join('');
  document.body.appendChild(overlay);
  overlay.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveModal(); }
  });
  window._modalPath = path;
  window._modalDraftPath = path;
  buildToolbar('modalToolbar', 'modal');
  if (!window.marked) loadEditorLibs(function() { updateModalPreview(); });
  else setTimeout(updateModalPreview, 100);
  updateModalStats();
}

function onModalEdit(path) {
  // Auto-save draft
  var titleEl = document.getElementById('mtitle');
  var bodyEl = document.getElementById('mcontent');
  if (!bodyEl) return;
  var full = buildFrontmatter(
    { title: titleEl ? titleEl.value.trim() : '' },
    bodyEl.value
  );
  saveDraft(path, full);
  updateModalPreview();
}

window.discardDraft = function(path) {
  clearDraft(path);
  editFile(path); // Reload from server
};

function updateModalStats() {
  updateEditorStats('modal');
}

function updateModalPreview() {
  updateModalStats();
  previewMd();
}

function buildToolbar(containerId, fnPrefix) {
  var tb = document.getElementById(containerId);
  if (!tb) return;
  var btns = [
    ['**','**','B','粗体'],['*','*','I','斜体'],['## ','','H','标题'],
    ['---\n','','—','分隔线'],['[','](url)','🔗','链接'],['![](','?)','🖼','图片'],
    ['\n\n```\n','\n```\n','</>','代码'],['\n- ','','•','列表'],
    ['\n> ','','❝','引用'],['$$\n','\n$$','∑','公式'],['$','$','∫','行内公式']
  ];
  btns.forEach(function(b) {
    var btn = document.createElement('button');
    btn.innerHTML = b[2];
    btn.title = b[3];
    btn.onclick = function() {
      var ta = document.getElementById(fnPrefix === 'modal' ? 'mcontent' : 'ncontent');
      if (!ta) return;
      var start = ta.selectionStart, end = ta.selectionEnd;
      var sel = ta.value.substring(start, end) || b[3];
      ta.value = ta.value.substring(0, start) + b[0] + sel + b[1] + ta.value.substring(end);
      ta.focus();
      if (fnPrefix === 'modal') previewMd(); else previewNew();
    };
    tb.appendChild(btn);

window.viewHistory = function(path) {
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = '<div class="modal" style="width:800px;"><h3>📜 ' + escHtml(path) + ' 修改历史</h3><div id="historyContent"><p class="dim">加载中...</p></div><div class="btns" style="margin-top:12px"><button class="btn btn-red" onclick="closeModal()">关闭</button></div></div>';
  document.body.appendChild(overlay);

  gh('/repos/' + REPO + '/commits?path=' + encodeURIComponent(path) + '&per_page=15').then(function(commits) {
    if (!Array.isArray(commits) || commits.length === 0) {
      document.getElementById('historyContent').innerHTML = '<p class="dim">暂无提交记录</p>';
      return;
    }
    var html = '<table><tr><th>时间</th><th>作者</th><th>提交信息</th><th>操作</th></tr>';
    commits.forEach(function(c, i) {
      var sha = c.sha ? c.sha.substring(0, 7) : '?';
      var date = c.commit ? c.commit.author.date.substring(0, 19).replace('T', ' ') : '?';
      var author = c.commit ? c.commit.author.name : '?';
      var msg = c.commit ? c.commit.message.split('\n')[0] : '?';
      var isLatest = i === 0;
      html += '<tr>';
      html += '<td style="white-space:nowrap;font-size:12px;">' + date + '</td>';
      html += '<td style="font-size:12px;">' + escHtml(author) + '</td>';
      html += '<td style="font-size:12px;">' + escHtml(msg) + '<br><code style="font-size:11px;">' + sha + '</code></td>';
      html += '<td style="white-space:nowrap">';
      if (!isLatest) html += '<button class="btn btn-sm" onclick="restoreVersion(\'' + path + '\',\'' + c.sha + '\',\'' + sha + '\')">↩ 恢复</button>';
      else html += '<span class="dim" style="font-size:12px;">当前版本</span>';
      html += '</td></tr>';
    });
    html += '</table>';
    document.getElementById('historyContent').innerHTML = html;
  }).catch(function(e) {
    document.getElementById('historyContent').innerHTML = '<p class="red">加载失败: ' + (e.message||e) + '</p>';
  });
};

window.restoreVersion = function(path, sha, shortSha) {
  if (!confirm('确定恢复到 ' + shortSha + ' 版本？这将覆盖当前文件内容。')) return;
  document.getElementById('historyContent').innerHTML = '<p>加载版本中...</p>';
  gh('/repos/' + REPO + '/contents/' + encodeURIComponent(path) + '?ref=' + sha).then(function(meta) {
    if (!meta || meta.message) { document.getElementById('historyContent').innerHTML = '<p class="red">获取失败: ' + (meta ? meta.message : '') + '</p>'; return; }
    var raw = meta.content.replace(/\n/g, '');
    var content = atob(raw);
    try { content = decodeURIComponent(escape(content)); } catch(e) {}
    // Put the old content into the current editor
    closeModal(); // close history
    showModal(path, content);
    // Show a notice
    setTimeout(function() {
      var notice = document.querySelector('.warn');
      if (notice) notice.innerHTML = '<b>📜 已加载 ' + shortSha + ' 版本</b> 保存后才会生效。';
    }, 200);
  }).catch(function(e) {
    document.getElementById('historyContent').innerHTML = '<p class="red">加载失败: ' + e.message + '</p>';

};

function toHex(color) {
  if (color.startsWith('#')) return color;
  // Simple named or rgb conversion
  var d = document.createElement('div');
  d.style.color = color;
  document.body.appendChild(d);
  var cs = getComputedStyle(d).color;
  document.body.removeChild(d);
  var m = cs.match(/(\d+)/g);
  if (!m) return '#000000';
  return '#' + (1<<24|parseInt(m[0])<<16|parseInt(m[1])<<8|parseInt(m[2])).toString(16).slice(1);
}

  main.innerHTML = `
<div class="page-bar"><h2>🔗 导航栏</h2></div>
<div class="warn"><b>💡</b> 添加、删除、排序导航项。带 ▾下拉 的可展开子项。点 ↑↓ 调整顺序。</div>
<table>
<tr><th style="width:30px"></th><th style="width:30px"></th><th>名称</th><th>链接</th><th style="width:140px"></th></tr>
${listHtml}
</table>
<div style="margin:12px 0"><button class="btn btn-sm" onclick="addNavItem()">+ 添加链接</button></div>

window.addNavItem = function() {
  if (!window._navItems) window._navItems = [];
  window._navItems.push({ text: '新链接', link: '/new-page/' });
  renderNavEditor();
};

window.addNavChild = function(i) {
  var items = window._navItems;
  if (!items[i].children) items[i].children = [];
  items[i].children.push({ text: '新子项', link: '/child-page/' });
  renderNavEditor();
};

window.delNavItem = function(i) {
  window._navItems.splice(i, 1);
  renderNavEditor();
};

window.delNavChild = function(i, j) {
  var items = window._navItems;
  if (items[i] && items[i].children) items[i].children.splice(j, 1);
  renderNavEditor();
};

window.moveNavItem = function(i, dir) {
  var items = window._navItems;
  var j = i + dir;
  if (j < 0 || j >= items.length) return;
  var tmp = items[i];
  items[i] = items[j];
  items[j] = tmp;
  renderNavEditor();
};

window.saveNavbar = function() {
  var items = window._navItems || [];
  var newItems = [];
  items.forEach(function(item, idx) {
    var label = document.getElementById('nlabel' + idx);
    var href = document.getElementById('nhref' + idx);
    var text = (label ? label.value.trim() : item.text) || '';
    var link = (href ? href.value.trim() : item.link) || '';
    var childArr = (item.children && item.children.length) ? [] : null;
    if (childArr !== null) {
      item.children.forEach(function(child, j) {
        var cl = document.getElementById('nchild_label' + idx + '_' + j);
        var ch = document.getElementById('nchild_href' + idx + '_' + j);
        var ct = (cl ? cl.value.trim() : child.text) || '';
        var ck = (ch ? ch.value.trim() : child.link) || '';
        if (ct || ck) childArr.push({ text: ct, link: ck });
      });
    }
    var out = { text: text };
    if (childArr && childArr.length) out.children = childArr;
    else if (link) out.link = link;
    if (text || link || (childArr && childArr.length)) newItems.push(out);
  });

  document.getElementById('navStatus').textContent = '保存中...';
  var body = {
    message: 'update navbar',
    content: b64enc(JSON.stringify(newItems, null, 2) + '\n'),
    branch: BRANCH
  };
  if (window._navSha) body.sha = window._navSha;

  gh('/repos/' + REPO + '/contents/.vuepress/navbar.json', { method: 'PUT', body: JSON.stringify(body) }).then(function(d) {
    if (d.content) {
      window._navSha = d.content.sha;
      window._navItems = newItems;
      document.getElementById('navStatus').textContent = '✅ 已保存，构建部署中（约 1-2 分钟）';
    } else {
      document.getElementById('navStatus').textContent = '❌ 保存失败: ' + (d.message||'');
    }
  });
};

// ── Sidebar Editor（完整三层嵌套）──
function loadSidebar() {
  var main = document.getElementById('main');
  main.innerHTML = '<p>加载中...</p>';
  gh('/repos/' + REPO + '/contents/.vuepress/sidebar.json?ref=' + BRANCH).then(function(meta) {
    if (!meta || meta.message) { main.innerHTML = '<p class="red">' + (meta ? meta.message : '空响应') + '</p>'; return; }
    if (!meta.content) { main.innerHTML = '<p class="red">响应中没有文件内容</p>'; return; }
    window._sideSha = meta.sha;
    var raw = meta.content.replace(/\n/g, '').replace(/\r/g, '');
    var content = atob(raw);
    try { content = decodeURIComponent(escape(content)); } catch(e) {}
    var data = {};
    try { data = JSON.parse(content || '{}'); } catch(e) { data = {}; }
    window._sideData = data;
    renderSidebar();
  }).catch(function(e) {
    main.innerHTML = '<p class="red">请求失败: ' + (e.message||e) + '</p>';
  });
}

// 递归渲染侧边栏路径分组
function renderSidebar() {
  var main = document.getElementById('main');
  var data = window._sideData || {};
  var paths = Object.keys(data);
  var html = '<div class="page-bar"><h2>📑 侧边栏</h2></div>';
  html += '<div class="warn"><b>💡</b> 侧边栏按路径分组，每组可含子分组与文件名列表。支持 /cpp/ /csharp/ 等多个路径。</div>';
  paths.forEach(function(p, i) {
    html += '<div style="border:1px solid #2a2a3a;border-radius:8px;margin:10px 0;padding:12px;">';
    html += '<b>路径:</b> <input id="spath' + i + '" value="' + escHtml(p) + '" style="width:120px;margin-right:8px" /> ';
    html += '<button class="btn btn-sm btn-red" onclick="delSidePath(' + i + ')">✕ 删路径</button>';
    // 分组
    var groups = data[p] || [];
    html += '<div style="margin-left:12px;margin-top:8px;">';
    groups.forEach(function(g, gi) {
      html += renderSideGroup(i, gi, g);
    });
    html += '<button class="btn btn-sm" onclick="addSideGroup(' + i + ')">+ 添加分组</button>';
    html += '</div>';
    html += '</div>';
  });
  html += '<button class="btn btn-sm" onclick="addSidePath()">+ 添加路径</button>';
  html += '<div style="margin-top:16px"><button class="btn" onclick="saveSidebar()">💾 保存侧边栏</button> <span id="sideStatus" class="dim"></span></div>';
  main.innerHTML = html;
}

// 渲染一个分组（支持 children 为字符串数组或子分组）
function renderSideGroup(pi, gi, g) {
  var idp = pi + '_' + gi;
  var hasChildren = Array.isArray(g.children);
  var isFileList = hasChildren && g.children.length > 0 && typeof g.children[0] === 'string';
  var h = '<div style="border-left:3px solid #6366f1;padding-left:8px;margin:6px 0;">';
  h += '<input id="sgroup_label' + idp + '" value="' + escHtml(g.text||'') + '" placeholder="分组名" style="width:160px" /> ';
  h += '<input id="sgroup_prefix' + idp + '" value="' + escHtml(g.prefix||'') + '" placeholder="prefix" style="width:120px;font-size:12px" /> ';
  h += '<label style="font-size:12px">折叠<input type="checkbox" id="sgroup_col' + idp + '"' + (g.collapsible ? ' checked' : '') + ' /></label> ';
  h += '<button class="btn btn-sm" onclick="addSideChild(' + pi + ',' + gi + ')">+文件</button> ';
  h += '<button class="btn btn-sm" onclick="addSideSubgroup(' + pi + ',' + gi + ')">+子分组</button> ';
  h += '<button class="btn btn-sm btn-red" onclick="delSideGroup(' + pi + ',' + gi + ')">✕</button>';
  h += '</div>';
  // children 渲染
  if (hasChildren) {
    h += '<div style="margin-left:16px;">';
    g.children.forEach(function(c, ci) {
      if (typeof c === 'string') {
        h += '<div><span style="opacity:.4">•</span> <input id="sfile' + pi + '_' + gi + '_' + ci + '" value="' + escHtml(c) + '" style="width:200px;font-size:12px" /> <button class="btn btn-sm btn-red" onclick="delSideChild(' + pi + ',' + gi + ',' + ci + ')">✕</button></div>';
      } else {
        // 子分组（递归）
        h += '<div style="background:rgba(99,102,241,.05);padding:4px 8px;margin:4px 0;border-radius:4px;">';
        h += '<b style="font-size:12px">└ 子分组</b> <input id="sgroup_label' + pi + '_' + gi + '_' + ci + '" value="' + escHtml(c.text||'') + '" placeholder="子分组名" style="width:120px;font-size:12px" /> ';
        h += '<input id="sgroup_prefix' + pi + '_' + gi + '_' + ci + '" value="' + escHtml(c.prefix||'') + '" placeholder="prefix" style="width:100px;font-size:12px" /> ';
        h += '<button class="btn btn-sm" onclick="addSubFile(' + pi + ',' + gi + ',' + ci + ')">+文件</button> ';
        h += '<button class="btn btn-sm btn-red" onclick="delSideChild(' + pi + ',' + gi + ',' + ci + ')">✕</button>';
        h += '<div style="margin-left:14px;">';
        (c.children||[]).forEach(function(sf, si) {
          h += '<div><span style="opacity:.4">–</span> <input id="sfile' + pi + '_' + gi + '_' + ci + '_' + si + '" value="' + escHtml(sf) + '" style="width:180px;font-size:12px" /> <button class="btn btn-sm btn-red" onclick="delSubFile(' + pi + ',' + gi + ',' + ci + ',' + si + ')">✕</button></div>';
        });
        h += '</div>';
        h += '</div>';
      }
    });
    h += '</div>';
  }
  return h;
}

window.addSidePath = function() {
  window._sideData['/new-path/'] = [];
  renderSidebar();
};
window.delSidePath = function(i) {
  var paths = Object.keys(window._sideData);
  delete window._sideData[paths[i]];
  renderSidebar();
};
window.addSideGroup = function(pi) {
  var p = Object.keys(window._sideData)[pi];

  renderSidebar();
};
window.delSideGroup = function(pi, gi) {
  var p = Object.keys(window._sideData)[pi];
  window._sideData[p].splice(gi, 1);
  renderSidebar();
};
window.addSideChild = function(pi, gi) {
  var p = Object.keys(window._sideData)[pi];
  window._sideData[p][gi].children.push('new-file');
  renderSidebar();
};
window.delSideChild = function(pi, gi, ci) {
  var p = Object.keys(window._sideData)[pi];
  window._sideData[p][gi].children.splice(ci, 1);
  renderSidebar();
};
window.addSideSubgroup = function(pi, gi) {
  var p = Object.keys(window._sideData)[pi];
  var g = window._sideData[p][gi];
  if (g.children.some(function(c){return typeof c === 'object';})) g.children.push({ text: '新子分组', prefix: '', collapsible: true, children: [] });

window.addSubFile = function(pi, gi, ci) {

  child.children = child.children || [];
  child.children.push('new-file');

};
window.delSubFile = function(pi, gi, ci, si) {

  var child = window._sideData[p][gi].children[ci];

window.saveSidebar = function() {
  var data = window._sideData || {};
  var out = {};
  var paths = Object.keys(data);
  paths.forEach(function(p, i) {
    var newPath = document.getElementById('spath' + i).value.trim();
    if (!newPath) return;
    var groups = (data[p] || []).map(function(g, gi) {
      var gLabel = document.getElementById('sgroup_label' + i + '_' + gi);
      var gPrefix = document.getElementById('sgroup_prefix' + i + '_' + gi);
      var gCol = document.getElementById('sgroup_col' + i + '_' + gi);
      var ng = { text: gLabel ? gLabel.value.trim() : (g.text||''), collapsible: gCol ? gCol.checked : (g.collapsible||false) };
      if (gPrefix && gPrefix.value.trim()) ng.prefix = gPrefix.value.trim();
      var children = (g.children||[]).map(function(c, ci) {
        if (typeof c === 'string') {
          var el = document.getElementById('sfile' + i + '_' + gi + '_' + ci);
          return el ? el.value.trim() : c;
        } else {
          var cl = document.getElementById('sgroup_label' + i + '_' + gi + '_' + ci);
          var cp = document.getElementById('sgroup_prefix' + i + '_' + gi + '_' + ci);
          var nc = { text: cl ? cl.value.trim() : (c.text||''), collapsible: true };
          if (cp && cp.value.trim()) nc.prefix = cp.value.trim();
          nc.children = (c.children||[]).map(function(sf, si) {
            var el2 = document.getElementById('sfile' + i + '_' + gi + '_' + ci + '_' + si);
            return el2 ? el2.value.trim() : sf;
          }).filter(Boolean);
          return nc;
        }
      }).filter(function(x){ return typeof x === 'string' ? x : x && (x.text || (x.children && x.children.length)); });
      if (children.length) ng.children = children;
      return ng;
    }).filter(function(g){ return g.text || (g.children && g.children.length); });
    if (groups.length) out[newPath] = groups;
  });

  document.getElementById('sideStatus').textContent = '保存中...';
  var body = { message: 'update sidebar', content: b64enc(JSON.stringify(out, null, 2) + '\n'), branch: BRANCH };
  if (window._sideSha) body.sha = window._sideSha;
  gh('/repos/' + REPO + '/contents/.vuepress/sidebar.json', { method: 'PUT', body: JSON.stringify(body) }).then(function(d) {
    if (d.content) {
      window._sideSha = d.content.sha;
      window._sideData = out;
      document.getElementById('sideStatus').textContent = '✅ 已保存，构建部署中（约 1-2 分钟）';
    } else {
      document.getElementById('sideStatus').textContent = '❌ 保存失败: ' + (d.message||'');
    }
  });
};

// ── Pages Build Management ──
function loadPagesBuild() {
  var main = document.getElementById('main');
  main.innerHTML = '<p>加载中...</p>';
  Promise.all([
    gh('/repos/' + REPO + '/pages').catch(function() { return null; }),
    gh('/repos/' + REPO + '/actions/runs?per_page=20').catch(function() { return { total_count: 0, workflow_runs: [] }; })
  ]).then(function(results) {
    var info = results[0];
    var runs = (results[1] && results[1].workflow_runs) || [];
    var html = '<div class="page-bar"><h2>🚀 构建部署</h2><button class="btn" onclick="triggerPagesBuild()" id="buildBtn">▶ 触发构建</button></div>';

    // 当前状态（Pages 信息：域名 / HTTPS）
    if (info && !info.message) {
      html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:24px;">';
      var statusColor = info.status === 'built' ? '#00d4aa' : (info.status === 'building' ? '#f39c12' : '#e74c3c');
      html += '<div style="background:#111;border:1px solid #2a2a3a;padding:20px;"><div style="font-size:14px;color:' + statusColor + ';font-weight:bold">' + (info.status || 'unknown') + '</div><div class="dim">Pages 状态</div></div>';
      html += '<div style="background:#111;border:1px solid #2a2a3a;padding:20px;"><div style="font-size:14px;color:#00d4aa">' + (info.cname || '-') + '</div><div class="dim">自定义域名</div></div>';
      var httpsStatus = info.https_certificate ? '✅ 已启用' : '❌ 未配置';
      var httpsEnforced = info.https_enforced ? '✅ 已强制' : '❌ 未强制';
      var httpsForceBtn = info.https_certificate && !info.https_enforced
        ? '<button class="btn btn-sm" onclick="enforceHTTPS()" style="margin-left:8px">🔒 启用强制 HTTPS</button>'
        : '';
      html += '<div style="background:#111;border:1px solid #2a2a3a;padding:20px;"><div style="font-size:14px">' + httpsStatus + ' · ' + httpsEnforced + httpsForceBtn + '</div><div class="dim">HTTPS</div></div>';
      html += '</div>';
    } else {
      html += '<div class="warn"><b>⚠</b> 无法获取 Pages 信息（token 可能需要 pages 权限）</div>';
    }

    // Actions runs 历史
    if (runs.length > 0) {
      html += '<b>Actions 构建历史</b><table><tr><th>状态</th><th>工作流</th><th>触发</th><th>时间</th><th>提交</th></tr>';
      runs.forEach(function(r) {
        var done = r.status === 'completed';
        var status = done ? (r.conclusion || 'completed') : 'running';
        var statusCls = r.conclusion === 'success' ? 'green' : (done ? 'red' : 'dim');
        var actor = r.actor ? r.actor.login : '?';
        var date = r.created_at ? r.created_at.substring(0, 19).replace('T', ' ') : '?';
        var commit = r.head_sha ? r.head_sha.substring(0, 7) : '?';
        html += '<tr><td class="' + statusCls + '">' + status + '</td><td>' + escHtml(r.name || 'deploy') + '</td><td>' + escHtml(actor) + '</td><td style="white-space:nowrap">' + date + '</td><td><code>' + commit + '</code></td></tr>';
      });
      html += '</table>';
    } else {
      html += '<p class="dim">暂无构建记录</p>';
    }

    html += '<div id="buildResult" class="dim" style="margin-top:8px"></div>';
    main.innerHTML = html;
  }).catch(function(e) {
    main.innerHTML = '<p class="red">加载失败: ' + (e.message||e) + '</p>';
  });
}

window.triggerPagesBuild = function() {
  var btn = document.getElementById('buildBtn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ 触发中...'; }
  var result = document.getElementById('buildResult');
  if (result) result.textContent = '⏫ 触发 Actions 构建...';
  gh('/repos/' + REPO + '/actions/workflows/deploy.yml/dispatches', { method: 'POST', body: JSON.stringify({ ref: BRANCH }) }).then(function(d) {
    if (d && d.message) {
      if (result) result.innerHTML = '<span class="red">❌ 触发失败: ' + d.message + '</span>';
      if (btn) { btn.disabled = false; btn.textContent = '▶ 触发构建'; }
    } else {
      if (result) result.innerHTML = '<span class="green">✅ 构建已触发！</span> 约 1-2 分钟完成。';
      setTimeout(loadPagesBuild, 3000);
    }
  }).catch(function(e) {
    if (result) result.innerHTML = '<span class="red">❌ 请求失败: ' + e.message + '</span>';
    if (btn) { btn.disabled = false; btn.textContent = '▶ 触发构建'; }
  });
};

window.enforceHTTPS = function() {
  var result = document.getElementById('buildResult');
  if (result) result.textContent = '🔒 启用 HTTPS 强制...';
  gh('/repos/' + REPO + '/pages', { method: 'PUT', body: JSON.stringify({
    cname: 'hn.liuxiyu.cn',
    https_enforced: true,
    branch: 'master'
  })}).then(function(d) {
    if (d && !d.message) {
      if (result) result.innerHTML = '<span class="green">✅ HTTPS 强制已启用！</span>';
      setTimeout(loadPagesBuild, 2000);
    } else {
      if (result) result.innerHTML = '<span class="red">❌ 启用失败: ' + (d ? d.message : 'unknown') + '</span>';
    }
  }).catch(function(e) {
    if (result) result.innerHTML = '<span class="red">❌ 请求失败: ' + e.message + '</span>';
  });
};

function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Theme Switcher ──
function toggleTheme() {
  var current = localStorage.getItem('csel_theme') || 'dark';
  var next = current === 'dark' ? 'light' : 'dark';
  localStorage.setItem('csel_theme', next);
  applyTheme(next);
  render(); // Re-render sidebar to update toggle text
}

function applyTheme(theme) {
  if (theme === 'light') document.body.classList.add('theme-light');
  else document.body.classList.remove('theme-light');
}

// ── Sitemap Generator ──
function loadSitemap() {
  var main = document.getElementById('main');
  main.innerHTML = '<p>加载中...</p>';
  gh('/repos/' + REPO + '/git/trees/' + BRANCH + '?recursive=1').then(function(data) {
    if (data.message) { main.innerHTML = '<p class="red">' + data.message + '</p>'; return; }
    var pages = data.tree.filter(function(f) { return f.path.startsWith('docs/') && f.path.endsWith('.md') && f.path !== 'docs/README.md' && f.path !== 'docs/test.md'; });
    var html = '<div class="page-bar"><h2>🗺 站点地图</h2><button class="btn" onclick="generateSitemap()" id="sitemapBtn">📄 生成 sitemap.xml</button></div>';
    html += '<p class="dim">扫描到 ' + pages.length + ' 个页面，生成 sitemap.xml 写入 .vuepress/public/，构建后随站点发布。</p>';
    html += '<table><tr><th>页面</th><th>URL</th></tr>';
    var siteUrl = 'https://hn.liuxiyu.cn';
    pages.forEach(function(f) {
      var urlPath = repoPathToUrl(f.path);
      html += '<tr><td>' + escHtml(f.path) + '</td><td><a href="' + siteUrl + urlPath + '" target="_blank" class="dim">' + siteUrl + urlPath + '</a></td></tr>';
    });
    html += '</table>';
    html += '<div id="sitemapResult" class="dim" style="margin-top:8px"></div>';
    main.innerHTML = html;
  }).catch(function(e) {
    main.innerHTML = '<p class="red">加载失败: ' + (e.message||e) + '</p>';
  });
}

window.generateSitemap = function() {
  var btn = document.getElementById('sitemapBtn');
  if (btn) btn.disabled = true;
  var result = document.getElementById('sitemapResult');
  if (result) result.textContent = '⏫ 扫描页面并生成...';
  gh('/repos/' + REPO + '/git/trees/' + BRANCH + '?recursive=1').then(function(data) {
    if (data.message) { if (result) result.innerHTML = '<span class="red">' + data.message + '</span>'; if (btn) btn.disabled = false; return; }
    var pages = data.tree.filter(function(f) { return f.path.startsWith('docs/') && f.path.endsWith('.md') && f.path !== 'docs/README.md' && f.path !== 'docs/test.md'; });
    var siteUrl = 'https://hn.liuxiyu.cn';
    var now = new Date().toISOString().split('T')[0];
    var xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
    xml += '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n';
    // Home page
    xml += '  <url><loc>' + siteUrl + '/</loc><priority>1.0</priority><lastmod>' + now + '</lastmod></url>\n';
    pages.forEach(function(f) {
      var urlPath = repoPathToUrl(f.path);
      if (urlPath === '/') return;   // 首页已在上面
      var priority = f.path.startsWith('docs/hacknet/') ? '0.7' : '0.8';
      xml += '  <url><loc>' + siteUrl + urlPath + '</loc><priority>' + priority + '</priority><lastmod>' + now + '</lastmod></url>\n';
    });
    xml += '</urlset>\n';

    if (result) result.textContent = '⏫ 提交 sitemap.xml...';
    gh('/repos/' + REPO + '/contents/.vuepress/public/sitemap.xml', { method: 'PUT', body: JSON.stringify({
      message: 'update sitemap.xml',
      content: b64enc(xml),
      sha: shaMap['.vuepress/public/sitemap.xml'] || undefined,
      branch: BRANCH
    })}).then(function(d) {
      if (d && d.content) {
        shaMap['.vuepress/public/sitemap.xml'] = d.content.sha;
        if (result) result.innerHTML = '<span class="green">✅ sitemap.xml 已提交！</span> 构建后随站点发布。';
      } else {
        if (result) result.innerHTML = '<span class="red">❌ 提交失败: ' + (d ? d.message : 'unknown') + '</span>';
      }
      if (btn) btn.disabled = false;
    });
  }).catch(function(e) {
    if (result) result.innerHTML = '<span class="red">❌ 错误: ' + e.message + '</span>';
    if (btn) btn.disabled = false;
  });
};

// ── Init ──
// Apply saved theme
applyTheme(localStorage.getItem('csel_theme') || 'dark');
var savedSession = localStorage.getItem('csel_session');
if (savedSession) {
  try {
    var s = JSON.parse(savedSession);
    fetch(API_BASE + '/api/auth/check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: s.token }) })
      .then(function(r) { return r.json(); }).then(function(d) {
        if (d.valid) { _session = s; render(); }
        else { localStorage.removeItem('csel_session'); render(); }
      }).catch(function() { render(); });
  } catch(e) { render(); }
} else { render(); }
</script>
