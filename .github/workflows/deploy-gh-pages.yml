# 部署到 GitHub Pages（作为 cdn.liuxiyu.cn 的备份站 / CDN）
# 触发条件：push 到 master（与 Vercel 自动部署共用一次 push）
# 使用 GitHub 官方 Pages 部署（workflow build_type），绕开 Jekyll 渲染
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        # 与 AGENTS.md 一致，只用 yarn。
        # vuepress-theme-hope@rc.107 engines 要求 yarn>=2，但项目用 yarn1，需 --ignore-engines。
        run: yarn --non-interactive --ignore-engines

      - name: Build
        run: yarn build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vuepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
